<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.36" stop-color="#ffd9a8" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#c9a2ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c9a2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff2dd"/>
      <stop offset="0.5" stop-color="#ffb46a"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
  </defs>
  <!-- light bent around the horizon (no background: the glow fades out to the tab itself) -->
  <circle cx="32" cy="32" r="30" fill="url(#halo)"/>
  <!-- the far side of the disk, lensed up over the top -->
  <ellipse cx="32" cy="30" rx="17" ry="15" fill="none" stroke="#fff0d8" stroke-width="3"/>
  <!-- the shadow -->
  <circle cx="32" cy="32" r="13.5" fill="#000"/>
  <!-- the near side of the disk, seen nearly edge-on, crossing in front -->
  <ellipse cx="32" cy="33.5" rx="30" ry="6.5" fill="none" stroke="url(#disk)" stroke-width="4.5" transform="rotate(-10 32 33.5)"/>
</svg>
