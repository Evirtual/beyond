<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 58 58">
  <defs>
    <radialGradient id="aura">
      <stop offset="0.15" stop-color="#c9bcff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#8270bf" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8270bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matter">
      <stop stop-color="#d9caff" stop-opacity=".55"/>
      <stop offset=".2" stop-color="#e5dcff" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#f8f4ff"/>
      <stop offset=".55" stop-color="#efe2ff"/>
      <stop offset=".8" stop-color="#ddd4ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ded4ff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="arc" x2="0" y2="1">
      <stop stop-color="#f8f4ff"/>
      <stop offset=".5" stop-color="#eee4ff"/>
      <stop offset="1" stop-color="#ddd2ff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation=".3"/></filter>
  </defs>
  <!-- Echo Glass.tsx: tab-sized mark: enlarged shadow and heavier light for readability. -->
  <circle cx="32" cy="32" r="29" fill="url(#aura)"/>
  <g transform="rotate(-15 32 32)">
    <g fill="none" stroke="url(#matter)">
      <ellipse cx="32" cy="32" rx="30" ry="4.8" stroke-width="2.5" filter="url(#bloom)"/>
      <ellipse cx="32" cy="32" rx="27" ry="4.1" stroke-width="2.5"/>
      <ellipse cx="32" cy="32" rx="23" ry="3.5" stroke-width="1.2"/>
      <ellipse cx="32" cy="32" rx="19" ry="2.9" stroke-width="1.2"/>
    </g>
    <circle cx="32" cy="32" r="15.5" fill="none" stroke="url(#arc)" stroke-width="3" filter="url(#bloom)"/>
    <circle cx="32" cy="32" r="15.5" fill="none" stroke="url(#arc)" stroke-width="4.5"/>
    <circle cx="32" cy="32" r="12.5" fill="#010105"/>
    <circle cx="32" cy="32" r="12.8" fill="none" stroke="#ede2ff" stroke-opacity=".85" stroke-width="1"/>
    <!-- Only the near half crosses the shadow; the far half stays behind it. -->
    <g fill="none" stroke="url(#matter)">
      <path d="M 2,32 Q 32,41.6 62,32" stroke-width="2" filter="url(#bloom)"/>
      <path d="M 2,32 Q 32,41.6 62,32" stroke-width="4"/>
      <path d="M 5,32 Q 32,40.2 59,32 M 9,32 Q 32,39 55,32 M 13,32 Q 32,37.8 51,32" stroke-width="1.2"/>
    </g>
  </g>
</svg>
