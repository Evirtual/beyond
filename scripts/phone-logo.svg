<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="aura">
      <stop offset="0.15" stop-color="#c9bcff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#8270bf" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8270bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matter">
      <stop stop-color="#c9bcff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#e5dcff" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#fff0dc"/>
      <stop offset=".55" stop-color="#efe2ff"/>
      <stop offset=".8" stop-color="#ac95e6" stop-opacity=".4"/>
      <stop offset="1" stop-color="#8871c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x2="0" y2="1">
      <stop stop-color="#fff0dc"/>
      <stop offset=".5" stop-color="#d7c8ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#9f86dd" stop-opacity=".25"/>
    </linearGradient>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation=".3"/></filter>
  </defs>
  <!-- Echo Glass.tsx: small shadow, wide edge-on disk, bright upper lensed arc. -->
  <circle cx="32" cy="32" r="29" fill="url(#aura)"/>
  <g transform="rotate(-10 32 32)">
    <g fill="none" stroke="url(#matter)">
      <ellipse cx="32" cy="32" rx="30" ry="4.8" stroke-width="2.5" filter="url(#bloom)"/>
      <ellipse cx="32" cy="32" rx="27" ry="4.1" stroke-width=".6"/>
      <ellipse cx="32" cy="32" rx="23" ry="3.5" stroke-width=".5"/>
      <ellipse cx="32" cy="32" rx="19" ry="2.9" stroke-width=".5"/>
    </g>
    <circle cx="32" cy="32" r="10.7" fill="none" stroke="url(#arc)" stroke-width="3" filter="url(#bloom)"/>
    <circle cx="32" cy="32" r="10.5" fill="none" stroke="url(#arc)" stroke-width="1.7" filter="url(#soft)"/>
    <circle cx="32" cy="32" r="9" fill="#010105"/>
    <circle cx="32" cy="32" r="9.2" fill="none" stroke="#ede2ff" stroke-opacity=".85" stroke-width=".3"/>
    <!-- Only the near half crosses the shadow; the far half stays behind it. -->
    <g fill="none" stroke="url(#matter)">
      <path d="M 2,32 Q 32,41.6 62,32" stroke-width="2" filter="url(#bloom)"/>
      <path d="M 2,32 Q 32,41.6 62,32" stroke-width=".75" filter="url(#soft)"/>
      <path d="M 5,32 Q 32,40.2 59,32 M 9,32 Q 32,39 55,32 M 13,32 Q 32,37.8 51,32" stroke-width=".4"/>
    </g>
  </g>
</svg>
