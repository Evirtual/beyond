<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<defs>
  <linearGradient id="disk"><stop stop-color="#d9d2ff" stop-opacity=".1"/><stop offset=".25" stop-color="#f2edff" stop-opacity=".8"/><stop offset=".45" stop-color="#fffef7"/><stop offset=".7" stop-color="#e3dcff" stop-opacity=".7"/><stop offset="1" stop-color="#d1c8ff" stop-opacity=".12"/></linearGradient>
  <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f4efff"/><stop offset=".45" stop-color="#eae3ff" stop-opacity=".9"/><stop offset="1" stop-color="#cfc4ff" stop-opacity=".5"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation=".4"/></filter>
  <clipPath id="front"><rect x="0" y="32" width="64" height="32"/></clipPath>
  <g id="rings" fill="none" stroke="url(#disk)" stroke-width=".18">
<ellipse cx="32" cy="32" rx="12.00" ry="2.76" />
<ellipse cx="32" cy="32" rx="12.77" ry="2.94" />
<ellipse cx="32" cy="32" rx="13.54" ry="3.11" />
<ellipse cx="32" cy="32" rx="14.31" ry="3.29" />
<ellipse cx="32" cy="32" rx="15.08" ry="3.47" />
<ellipse cx="32" cy="32" rx="15.85" ry="3.65" />
<ellipse cx="32" cy="32" rx="16.62" ry="3.82" />
<ellipse cx="32" cy="32" rx="17.39" ry="4.00" />
<ellipse cx="32" cy="32" rx="18.16" ry="4.18" />
<ellipse cx="32" cy="32" rx="18.93" ry="4.35" />
<ellipse cx="32" cy="32" rx="19.70" ry="4.53" />
<ellipse cx="32" cy="32" rx="20.47" ry="4.71" />
<ellipse cx="32" cy="32" rx="21.24" ry="4.89" />
<ellipse cx="32" cy="32" rx="22.01" ry="5.06" />
<ellipse cx="32" cy="32" rx="22.78" ry="5.24" />
<ellipse cx="32" cy="32" rx="23.55" ry="5.42" />
<ellipse cx="32" cy="32" rx="24.32" ry="5.59" />
<ellipse cx="32" cy="32" rx="25.09" ry="5.77" />
<ellipse cx="32" cy="32" rx="25.86" ry="5.95" />
<ellipse cx="32" cy="32" rx="26.63" ry="6.12" />
<ellipse cx="32" cy="32" rx="27.40" ry="6.30" />
<ellipse cx="32" cy="32" rx="28.17" ry="6.48" />
<ellipse cx="32" cy="32" rx="28.94" ry="6.66" />
<ellipse cx="32" cy="32" rx="29.71" ry="6.83" />
  </g>
</defs>
<!-- Dense concentric disk, white-lilac upper lensing and a fine lower rim. -->
<g transform="rotate(-10 32 32)">
  <use href="#rings" stroke-opacity=".65"/>
  <use href="#rings" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="10.8" fill="none" stroke="url(#halo)" stroke-width="4.5" filter="url(#glow)"/>
  <path d="M21.2 32 A10.8 10.8 0 0 1 42.8 32" fill="none" stroke="#eee8ff" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="9.2" fill="#020207"/>
  <use href="#rings" opacity=".3"/>
  <circle cx="32" cy="32" r="9.4" fill="none" stroke="#f5f0ff" stroke-width=".45"/>
  <g clip-path="url(#front)">
    <use href="#rings" filter="url(#soft)"/>
    <use href="#rings"/>
  </g>
</g>
</svg>
